<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gamer Status Tracker</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

:root{
  --ok:#00ff88;
  --bad:#ff0033;
  --warn:#ffaa00;
  --risk:#ffee00;
  --discord:#5865F2;
}

/* BASE */
body{
  margin:0;
  font-family:'Orbitron',monospace;
  background:#030308;
  color:#fff;
}

/* 🔥 FIX: BACKGROUND NOT BLOCKING CLICK */
body::before,
body::after{
  pointer-events:none;
}

/* GRID BG */
body::before{
  content:'';
  position:fixed;
  width:100%;
  height:100%;
  background:
    linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);
  background-size:40px 40px;
}

/* SCANLINE */
body::after{
  content:'';
  position:fixed;
  width:100%;
  height:100%;
  background:linear-gradient(transparent, rgba(0,255,255,0.05), transparent);
  animation:scan 6s linear infinite;
}

@keyframes scan{
  0%{transform:translateY(-100%)}
  100%{transform:translateY(100%)}
}

.wrap{
  max-width:1100px;
  margin:50px auto;
  padding:20px;
}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#00ffff;
  text-shadow:0 0 15px #00ffff;
}

/* DISCORD BUTTON */
.discord-btn{
  padding:10px 20px;
  border-radius:8px;
  background:var(--discord);
  color:#fff;
  font-weight:700;
  text-decoration:none;
  box-shadow:0 0 15px var(--discord);
  transition:.3s;
}
.discord-btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px var(--discord);
}

/* CARD */
.card{
  background:rgba(0,0,0,.6);
  border:1px solid rgba(0,255,255,.2);
  border-radius:12px;
  padding:20px;
  box-shadow:0 0 40px rgba(0,255,255,.1);
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:14px;
  text-align:left;
}

thead{
  color:#00ffff;
}

tbody tr{
  border-bottom:1px solid rgba(255,255,255,.05);
  transition:.3s;
}

tbody tr:hover{
  background:rgba(0,255,255,.08);
  transform:scale(1.01);
}

/* GAME TAG */
.game-tag{
  padding:4px 10px;
  border-radius:6px;
  font-size:12px;
  background:rgba(0,255,255,.1);
  border:1px solid rgba(0,255,255,.3);
}

/* BADGES */
.badge{
  padding:6px 14px;
  border-radius:20px;
  font-weight:700;
  text-transform:uppercase;
}

/* STATUS */
.ok{
  color:var(--ok);
  border:2px solid var(--ok);
  box-shadow:0 0 10px var(--ok);
}
.bad{
  color:var(--bad);
  border:2px solid var(--bad);
  animation:alert 0.8s infinite alternate;
}
.updating{
  color:var(--warn);
  border:2px solid var(--warn);
}
.risk{
  color:var(--risk);
  border:2px solid var(--risk);
}

@keyframes alert{
  from{box-shadow:0 0 10px var(--bad)}
  to{box-shadow:0 0 30px var(--bad)}
}

/* DISCORD PANEL */
.discord-panel{
  margin-top:25px;
  padding:20px;
  border:1px solid var(--discord);
  border-radius:10px;
  text-align:center;
  box-shadow:0 0 20px var(--discord);
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{box-shadow:0 0 10px var(--discord)}
  to{box-shadow:0 0 30px var(--discord)}
}

.footer{
  margin-top:20px;
  text-align:center;
  color:#777;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="logo">🎮 DEVIL STORE</div>

  <!-- ✅ WORKING DISCORD BUTTON -->
  <a class="discord-btn"
     href="https://discord.gg/waKmmYAbtd"
     target="_blank"
     rel="noopener noreferrer">
    Join Discord
  </a>
</header>

<div class="card">

<table>
<thead>
<tr>
<th>Software</th>
<th>Game</th>
<th>Status</th>
<th>Notes</th>
</tr>
</thead>

<tbody id="list"></tbody>
</table>

<!-- DISCORD PANEL -->
<div class="discord-panel">
  🚀 Join our Discord for live updates & support  
  <br><br>

  <!-- ✅ SECOND WORKING BUTTON -->
  <a class="discord-btn"
     href="https://discord.gg/waKmmYAbtd"
     target="_blank"
     rel="noopener noreferrer">
    CLICK TO JOIN
  </a>
</div>

<div class="footer">
⚠ Use at your own risk — live gamer tracker
</div>

</div>
</div>

<script>

const DATA = [
  { name:'FECURITY', game:'Call of Duty', status:'undetected' },
  { name:'DULLWAVE', game:'Call of Duty', status:'undetected' },
  { name:'ARCAN', game:'Apex Legend', status:'undetected' },
  { name:'BSS', game:'PUBG', status:'UPDATING' },
  { name:'ARCAN', game:'PUBG', status:'risk' },
  { name:'DODO', game:'PUBG', status:'UPDATING' },
  { name:'OWO', game:'PUBG', status:'undetected' },
  { name:'IO', game:'PUBG', status:'UPDATING' },
  { name:'ARES ARC RAIDERS', game:'ARC RAIDERS', status:'undetected' },
  { name:'ANCIENT ARC RAIDERS', game:'ARC RAIDERS', status:'undetected' }
];

const tbody = document.getElementById('list');

function makeRow(item){
  let cls='bad', txt='DETECTED';

  if(item.status==='undetected'||item.status==='undetect'){
    cls='ok'; txt='UNDETECTED';
  }
  else if(item.status==='updating'){
    cls='updating'; txt='UPDATING';
  }
  else if(item.status==='risk'){
    cls='risk'; txt='USE AT OWN RISK';
  }

  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><b>${item.name}</b></td>
    <td><span class="game-tag">${item.game}</span></td>
    <td><span class="badge ${cls}">${txt}</span></td>
    <td>-</td>
  `;
  return tr;
}

function render(){
  tbody.innerHTML='';
  DATA.forEach(i=>tbody.appendChild(makeRow(i)));
}

render();

</script>

</body>
</html>
