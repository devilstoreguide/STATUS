<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cheat Status Dashboard — Neon</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');
    :root{
      --bg: #05010a;
      --neon-cyan: #00f0ff;
      --neon-pink: #ff2d9c;
      --neon-purple: #8b5cf6;
      --accent: #ff00ff;
      --ok: #00ffcc;
      --bad: #ff0066;
      --warn: #ffcc00; /* New color for Updating */
      --glass: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --radius: 16px;
    }
    
    html,body{
      height:100%;
      margin:0;
      background: radial-gradient(circle at 20% 80%, #0a0020, #05010a 40%, #02040a);
      font-family: 'Orbitron', monospace;
      color: #eaf6ff;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(2px 2px at 20px 30px, rgba(0,255,204,0.15), transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,0,255,0.1), transparent),
        radial-gradient(1px 1px at 90px 40px, rgba(0,240,255,0.2), transparent),
        radial-gradient(1px 1px at 130px 80px, rgba(139,92,246,0.15), transparent);
      background-size: 200px 200px;
      animation: sparkle 20s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    
    @keyframes sparkle {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-200px); }
    }
    
    .wrap{
      max-width: 1100px;
      margin: 60px auto;
      padding: 30px;
      position: relative;
      z-index: 2;
    }
    
    header{
      display:flex;
      gap:20px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:40px;
      padding: 20px 0;
      border-bottom: 1px solid rgba(0,255,255,0.2);
    }
    
    .brand{
      display:flex;
      gap:18px;
      align-items:center;
    }
    
    .logo{
      width:80px;
      height:80px;
      border-radius:16px;
      background: conic-gradient(from 0deg, #ff00ff, #00ffff, #ff2d9c, #8b5cf6);
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      color:white;
      font-size:28px;
      letter-spacing:2px;
      text-shadow: 0 0 15px #fff, 0 0 30px #ff00ff, 0 0 45px #00ffff;
      box-shadow: 
        0 0 40px rgba(255,0,255,0.4), 
        inset 0 0 30px rgba(0,255,255,0.3),
        0 8px 32px rgba(0,0,0,0.6);
      position: relative;
      animation: logoGlow 3s ease-in-out infinite alternate;
    }
    
    @keyframes logoGlow {
      0% { transform: scale(1); box-shadow: 0 0 40px rgba(255,0,255,0.4), inset 0 0 30px rgba(0,255,255,0.3); }
      100% { transform: scale(1.05); box-shadow: 0 0 60px rgba(255,0,255,0.6), inset 0 0 40px rgba(0,255,255,0.4); }
    }
    
    h1{
      margin:0;
      font-size:32px;
      font-weight:900;
      line-height:1.2;
      background: linear-gradient(45deg, #ff00ff, #00ffff, #ff2d9c);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255,0,255,0.5);
    }
    
    .update-info {
      text-align:right;
      background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(0,255,255,0.1);
      backdrop-filter: blur(10px);
    }
    
    .card{
      background: linear-gradient(180deg, var(--glass), rgba(255,255,255,0.02));
      border-radius: var(--radius);
      padding:40px;
      box-shadow: 
        0 0 40px rgba(255,0,255,0.1), 
        0 0 80px rgba(0,255,255,0.05);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      position: relative;
    }
    
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      font-size:15px;
    }
    
    thead th{
      text-align:left;
      font-size:14px;
      color:#7f8c99;
      padding:20px 15px;
      text-transform:uppercase;
      letter-spacing:2px;
      border-bottom: 2px solid rgba(0,255,255,0.3);
    }
    
    tbody tr{
      background: rgba(255,255,255,0.02);
      transition: all .3s ease;
    }
    
    tbody tr:hover{
      transform: scale(1.01);
      background: rgba(255,255,255,0.05);
    }
    
    td{
      padding:18px 15px;
      vertical-align:middle;
      border-top:1px solid rgba(255,255,255,0.06);
    }
    
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 16px;
      border-radius:25px;
      font-weight:700;
      font-size:12px;
      text-transform:uppercase;
      text-shadow: 0 0 8px currentColor;
    }
    
    /* Status Styles */
    .ok{ 
      background: rgba(0,255,204,0.1); 
      color:var(--ok); 
      border:1px solid var(--ok); 
    }
    .bad{ 
      background: rgba(255,0,102,0.1); 
      color:var(--bad); 
      border:1px solid var(--bad); 
    }
    .updating{ 
      background: rgba(255,204,0,0.1); 
      color:var(--warn); 
      border:1px solid var(--warn); 
    }
    
    .name{ font-weight:800; font-size:18px; color: #ffffff; }
    .meta{ font-size:13px; color:#7f8c99; margin-top:4px; }
    
    .legend{
      display:flex;
      gap:20px;
      justify-content: center;
      margin-top:30px;
      padding: 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      flex-wrap: wrap;
    }
    
    .footer{
      margin-top:30px;
      font-size:12px;
      color:#7f8c99;
      text-align: center;
    }
    
    .product-focused {
      border: 2px solid var(--neon-cyan) !important;
      box-shadow: 0 0 30px rgba(0,240,255,0.3);
    }

    @media (max-width:768px){
      thead{display:none}
      tbody td{ display:block; width:100%; padding:10px 15px; }
      tbody tr{ margin-bottom:15px; display:block; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">ST</div>
        <div>
          <h1>Status Tracker</h1>
          <p class="lead" id="pageSubtitle">System Monitor</p>
        </div>
      </div>
      <div class="update-info">
        <small>LIVE STATUS: <span id="lastUpdated">—</span></small>
      </div>
    </header>
    
    <div class="card">
      <table id="productTable">
        <thead>
          <tr>
            <th>Software</th>
            <th>Game</th>
            <th>Status</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
      
      <div class="legend">
        <span><span class="badge ok">✔ Undetected</span> Safe</span>
        <span><span class="badge updating">⚙ Updating</span> Maintenance</span>
        <span><span class="badge bad">⚠ Use At Own Risk</span> High Risk</span>
      </div>
      
      <p class="footer">
        ⚠ <strong>Disclaimer:</strong> This dashboard is for informational purposes only. Use software at your own discretion.
      </p>
    </div>
  </div>
  
  <script>
    /* STATUS KEYS: 
       'undetected' -> Cyan (Safe)
       'updating'   -> Amber (Maintenance)
       'risk'       -> Pink/Red (Use at own risk)
    */
    const DATA = [
      { name: 'FECURITY', game: 'Call of Duty', status: 'undetected', note: 'product is updated you can play now' },
      { name: 'DULLWAVE', game: 'Call of Duty', status: 'undetected', note: 'product is updated you can play now' },
      { name: 'ARCAN', game: 'Apex Legend', status: 'undetected', note: 'product is updated you can play now' },
      { name: 'BSS', game: 'PUBG', status: 'undetected', note: 'product is updated you can play now' },
      { name: 'ARCAN', game: 'PUBG', status: 'risk', note: 'Use with caution' },
      { name: 'DODO', game: 'PUBG', status: 'undetected', note: 'product is updated you can play now' },
      { name: 'ARES ARC RAIDERS', game: 'ARC RAIDERS', status: 'undetected', note: 'product is updated you can play now' },
      { name: 'ANCIENT ARC RAIDERS', game: 'ARC RAIDERS', status: 'undetected', note: 'product is updated you can play now' },
      { name: 'OWO', game: 'PUBG', status: 'undetected', note: 'product is updated you can play now' },
      { name: 'IO', game: 'PUBG', status: 'undetected', note: 'product is updated you can play now' }
    ];
    
    const tbody = document.getElementById('list');
    const lastUpdated = document.getElementById('lastUpdated');
    
    function getStatusConfig(status) {
      switch(status) {
        case 'undetected': return { class: 'ok', text: '✔ Undetected' };
        case 'updating':   return { class: 'updating', text: '⚙ Updating' };
        case 'risk':       return { class: 'bad', text: '⚠ Use At Own Risk' };
        default:           return { class: '', text: status };
      }
    }

    function makeRow(item){
      const tr = document.createElement('tr');
      const config = getStatusConfig(item.status);
      
      tr.innerHTML = `
        <td><div class="name">${item.name}</div><div class="meta">${item.game}</div></td>
        <td>${item.game}</td>
        <td><span class="badge ${config.class}">${config.text}</span></td>
        <td>${item.note || '—'}</td>
      `;
      return tr;
    }
    
    function render(list){
      tbody.innerHTML = '';
      list.forEach(item => tbody.appendChild(makeRow(item)));
    }
    
    // Initialize
    render(DATA);
    lastUpdated.textContent = new Date().toLocaleTimeString();
  </script>
</body>
</html>
